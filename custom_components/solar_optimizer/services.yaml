reload:
  name: Reload
  description: Reload Solar Optimizer configuration

reset_on_time:
    name: Reset on time
    description: Reset all on time for all devices
    target:
        entity:
            integration: solar_optimizer

start_device:
    name: Start device
    description: >
        Force the activation of a managed device for a given duration.
        Sets enable=false, turns the device on, and optionally starts a countdown timer.
        When the timer expires, SO management is re-enabled automatically without sending any command (the device is not stopped).
    fields:
        device_id:
            name: Device ID
            description: >
                The unique ID of the managed device (the part after switch.solar_optimizer_, e.g. lave_linge).
            required: true
            selector:
                text:
        duration:
            name: Duration (hours)
            description: >
                Duration of the forced activation in hours (e.g. 1, 4, 12, 24).
                If omitted, the activation is unlimited until stop_device is called.
            required: false
            selector:
                number:
                    min: 1
                    max: 24
                    step: 1
                    mode: box

stop_device:
    name: Stop device
    description: >
        Stop the forced activation of a managed device.
        Clears the countdown timer and turns the device off.
    fields:
        device_id:
            name: Device ID
            description: >
                The unique ID of the managed device (the part after switch.solar_optimizer_, e.g. lave_linge).
            required: true
            selector:
                text:

end_manual:
    name: End manual mode
    description: >
        Give a device changed by hand back to Solar Optimizer. No command is sent: the device stays
        as it is and the algorithm decides in the next cycles.
    fields:
        device_id:
            name: Device ID
            description: >
                The unique ID of the managed device (the part after switch.solar_optimizer_, e.g. lave_linge).
            required: true
            selector:
                text:

set_charge_period:
    name: Set charge period
    description: >
        Create or edit a period of the car's charge plan. One-off (start/end as epoch seconds) or
        weekly (weekdays 0 = Monday, start_time/end_time as HH:MM). Modes: fixed (kw), sun (the car
        takes all the surplus) and away (the car spends pct % of battery).
    fields:
        id:
            name: Id
            description: Period to edit; omit to create a new one.
            required: false
            selector:
                text:
        mode:
            name: Mode
            required: true
            selector:
                select:
                    options: [fixed, sun, away]
        kw:
            name: Power (kW)
            required: false
            selector:
                number:
                    min: 0
                    max: 50
                    step: 0.1
                    mode: box
        pct:
            name: Battery spent (%)
            required: false
            selector:
                number:
                    min: 0
                    max: 100
                    mode: box
        enabled:
            name: Enabled
            required: false
            selector:
                boolean:

remove_charge_period:
    name: Remove charge period
    description: Delete a period of the car's charge plan.
    fields:
        id:
            name: Id
            required: true
            selector:
                text:
